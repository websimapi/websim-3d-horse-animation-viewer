<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Horse Animation Editor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #2a2a2a;
            color: #f0f0f0;
        }
        #scene-container {
            position: absolute;
            width: 100%;
            height: 70%;
        }
        #editor-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background-color: #333;
            display: flex;
            flex-direction: column;
            border-top: 2px solid #555;
        }
        #timeline-container {
            padding: 10px;
            border-bottom: 1px solid #444;
        }
        #timeline {
            width: 100%;
            height: 30px;
            background-color: #222;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
        }
        #timeline-scrubber {
            position: absolute;
            width: 2px;
            height: 100%;
            background-color: #f00;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        #timeline-segments {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
        }
        .timeline-segment {
            position: absolute;
            height: 100%;
            background-color: rgba(100, 180, 255, 0.3);
            border-left: 2px solid rgba(100, 180, 255, 0.8);
            border-right: 2px solid rgba(100, 180, 255, 0.8);
        }
        #control-panels {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .panel {
            flex: 1;
            padding: 10px;
            border-right: 1px solid #444;
            overflow-y: auto;
        }
        .panel h3 {
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }
        button {
            padding: 8px 12px;
            background-color: #4a7e3f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            margin: 2px;
        }
        button:hover {
            background-color: #5d9e4f;
        }
        button.active {
            background-color: #2e5027;
            box-shadow: 0 0 8px rgba(93, 158, 79, 0.8);
        }
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }
        input[type="number"] {
            width: 60px;
            background-color: #444;
            color: white;
            border: 1px solid #555;
            padding: 4px;
            border-radius: 3px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            font-size: 20px;
            z-index: 100;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
        .flex-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            margin-bottom: 10px;
        }
        .flex-row label {
            margin-right: 10px;
            min-width: 100px;
        }
        #segments-list {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
        .segment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            border-bottom: 1px solid #444;
        }
        .segment-item:hover {
            background-color: #444;
        }
        code {
            display: block;
            white-space: pre-wrap;
            background-color: #222;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
            font-family: monospace;
            max-height: 100px;
            overflow-y: auto;
        }
        /* New styles for still points */
        .still-marker {
            position: absolute;
            width: 2px;
            height: 100%;
            background-color: #ffd700;
            top: 0;
            z-index: 10;
        }
        
        .still-segment {
            position: absolute;
            height: 100%;
            background-color: rgba(255, 215, 0, 0.2);
            border-left: 2px solid rgba(255, 215, 0, 0.8);
            border-right: 2px solid rgba(255, 215, 0, 0.8);
            top: 0;
            z-index: 5;
        }
        
        #still-points-container {
            margin-top: 10px;
            margin-bottom: 10px;
        }
        
        .still-point-item {
            background-color: #444;
            padding: 6px;
            margin: 4px 0;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .still-point-item:hover {
            background-color: #555;
        }
        
        #still-points-controls {
            margin-bottom: 10px;
        }
        
        #analysis-options {
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div id="scene-container"></div>
    <div id="loading">Loading horse model...</div>
    <div id="info">Use mouse to rotate the view, scroll to zoom</div>
    
    <div id="editor-panel">
        <div id="timeline-container">
            <div class="flex-row">
                <button id="play-pause">▶️ Play</button>
                <button id="loop-toggle">🔁 Loop</button>
                <input type="range" id="playback-speed" min="0.1" max="2" step="0.1" value="1">
                <label for="playback-speed">Speed: <span id="speed-value">1.0</span>x</label>
                <span style="margin-left: 20px;">Time: <span id="current-time">0.00</span>s / <span id="total-time">0.00</span>s</span>
            </div>
            <div id="still-points-controls">
                <button id="detect-still-points">Detect Still Points</button>
                <button id="clear-still-points">Clear Markers</button>
                <div id="analysis-options">
                    <label for="still-threshold">Sensitivity:</label>
                    <input type="range" id="still-threshold" min="0.0001" max="0.01" step="0.0001" value="0.001">
                    <span id="threshold-value">0.001</span>
                    
                    <label for="min-still-duration">Min Duration:</label>
                    <input type="range" id="min-still-duration" min="0.05" max="1" step="0.05" value="0.2">
                    <span id="duration-value">0.2s</span>
                </div>
            </div>
            <div id="timeline">
                <div id="timeline-segments"></div>
                <div id="still-points-layer"></div>
                <div id="timeline-scrubber"></div>
            </div>
        </div>
        
        <div id="control-panels">
            <div class="panel" id="clip-editor">
                <h3>Animation Clip Editor</h3>
                <div class="flex-row">
                    <label for="clip-name">Clip Name:</label>
                    <input type="text" id="clip-name" value="New Clip" style="flex: 1; background: #444; color: white; border: 1px solid #555; padding: 5px;">
                </div>
                <div class="flex-row">
                    <label for="start-time">Start Time:</label>
                    <input type="number" id="start-time" min="0" step="0.01" value="0">
                    <button id="set-start">Set Current</button>
                </div>
                <div class="flex-row">
                    <label for="end-time">End Time:</label>
                    <input type="number" id="end-time" min="0" step="0.01" value="1">
                    <button id="set-end">Set Current</button>
                </div>
                <div class="flex-row">
                    <button id="preview-segment">Preview</button>
                    <button id="save-segment">Save Clip</button>
                </div>
                
                <h3>Saved Clips</h3>
                <div id="segments-list"></div>
                <div>
                    <button id="export-clips">Export All Clips</button>
                </div>
            </div>
            
            <div class="panel" id="model-info">
                <h3>Model Information</h3>
                <div id="bones-info">Loading bone information...</div>
                <div id="animation-stats"></div>
                
                <h3>Still Points</h3>
                <div>Points where animation has minimal movement:</div>
                <div id="still-points-container"></div>
            </div>
            
            <div class="panel" id="animation-preview">
                <h3>Animation Preview</h3>
                <div id="original-animations"></div>
                <h4>Custom Clips</h4>
                <div id="custom-clips"></div>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a2a);
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight * 0.7), 0.1, 1000);
        camera.position.set(0, 2, 5);
        
        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight * 0.7);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.getElementById('scene-container').appendChild(renderer.domElement);
        
        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(1, 5, 3);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);
        
        // Ground plane
        const groundGeometry = new THREE.PlaneGeometry(20, 20);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x333333,
            roughness: 0.8
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Variables for model and animations
        let mixer;
        let horse;
        let animations = [];
        let currentAction = null;
        let isPlaying = false;
        let isLooping = true;
        let playbackSpeed = 1.0;
        let currentTime = 0;
        let totalDuration = 0;
        let customClips = [];
        let stillPoints = [];
        
        // UI Elements
        const playPauseBtn = document.getElementById('play-pause');
        const loopToggleBtn = document.getElementById('loop-toggle');
        const playbackSpeedSlider = document.getElementById('playback-speed');
        const speedValueSpan = document.getElementById('speed-value');
        const currentTimeSpan = document.getElementById('current-time');
        const totalTimeSpan = document.getElementById('total-time');
        const timelineScrubber = document.getElementById('timeline-scrubber');
        const timeline = document.getElementById('timeline');
        const timelineSegments = document.getElementById('timeline-segments');
        const stillPointsLayer = document.getElementById('still-points-layer');
        const startTimeInput = document.getElementById('start-time');
        const endTimeInput = document.getElementById('end-time');
        const clipNameInput = document.getElementById('clip-name');
        const segmentsList = document.getElementById('segments-list');
        const bonesInfo = document.getElementById('bones-info');
        const animationStats = document.getElementById('animation-stats');
        const originalAnimations = document.getElementById('original-animations');
        const customClipsContainer = document.getElementById('custom-clips');
        const stillPointsContainer = document.getElementById('still-points-container');
        const detectStillPointsBtn = document.getElementById('detect-still-points');
        const clearStillPointsBtn = document.getElementById('clear-still-points');
        const stillThresholdSlider = document.getElementById('still-threshold');
        const minStillDurationSlider = document.getElementById('min-still-duration');
        const thresholdValueSpan = document.getElementById('threshold-value');
        const durationValueSpan = document.getElementById('duration-value');
        
        // Load horse model
        const loader = new GLTFLoader();
        loader.load('/horse_riggedgame_ready.glb', (gltf) => {
            horse = gltf.scene;
            
            // Set up the model
            horse.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            
            // Add to scene
            scene.add(horse);
            
            // Set up animations
            mixer = new THREE.AnimationMixer(horse);
            animations = gltf.animations;
            
            console.log("Available animations:", animations.map(a => a.name));
            
            // Display model information
            displayModelInfo(horse);
            
            // Display animation information
            displayAnimationInfo(animations);
            
            // Set up animation controls
            if (animations.length > 0) {
                // Get total duration
                totalDuration = animations[0].duration;
                totalTimeSpan.textContent = totalDuration.toFixed(2);
                endTimeInput.value = totalDuration.toFixed(2);
                endTimeInput.max = totalDuration;
                startTimeInput.max = totalDuration;
                
                // Create initial animation action
                currentAction = mixer.clipAction(animations[0]);
                currentAction.clampWhenFinished = true;
                currentAction.play();
                
                // Pause it initially
                mixer.timeScale = 0;
            }
            
            // Hide loading message
            document.getElementById('loading').style.display = 'none';
        }, 
        // Progress callback
        (xhr) => {
            const percent = (xhr.loaded / xhr.total) * 100;
            document.getElementById('loading').textContent = 
                `Loading horse model... ${Math.round(percent)}%`;
        }, 
        // Error callback
        (error) => {
            console.error('Error loading model:', error);
            document.getElementById('loading').textContent = 
                'Error loading horse model. Please try again.';
        });
        
        // Display Model Information
        function displayModelInfo(model) {
            let boneCount = 0;
            let boneInfo = '<h4>Skeleton Hierarchy:</h4><ul>';
            
            model.traverse((object) => {
                if (object.isBone) {
                    boneCount++;
                    boneInfo += `<li>${object.name}</li>`;
                }
            });
            
            boneInfo += '</ul>';
            bonesInfo.innerHTML = `<strong>Total Bones:</strong> ${boneCount}<br>${boneInfo}`;
        }
        
        // Display Animation Information
        function displayAnimationInfo(anims) {
            if (anims.length === 0) {
                animationStats.innerHTML = "No animations found";
                return;
            }
            
            let statsHtml = '';
            anims.forEach((anim, index) => {
                statsHtml += `<strong>Animation ${index}</strong><br>`;
                statsHtml += `Name: ${anim.name}<br>`;
                statsHtml += `Duration: ${anim.duration.toFixed(2)}s<br>`;
                statsHtml += `Tracks: ${anim.tracks.length}<br><br>`;
                
                // Create button for original animation
                const button = document.createElement('button');
                button.textContent = anim.name || `Animation ${index}`;
                button.addEventListener('click', () => playOriginalAnimation(index));
                originalAnimations.appendChild(button);
            });
            
            animationStats.innerHTML = statsHtml;
        }
        
        // Play original animation
        function playOriginalAnimation(index) {
            if (!mixer || index >= animations.length) return;
            
            // Stop current animation
            if (currentAction) {
                currentAction.stop();
            }
            
            // Start new animation
            const clip = animations[index];
            currentAction = mixer.clipAction(clip);
            currentAction.clampWhenFinished = !isLooping;
            currentAction.loop = isLooping ? THREE.LoopRepeat : THREE.LoopOnce;
            currentAction.reset();
            currentAction.play();
            
            // Update UI
            startTimeInput.value = 0;
            endTimeInput.value = clip.duration.toFixed(2);
            totalDuration = clip.duration;
            totalTimeSpan.textContent = totalDuration.toFixed(2);
            
            // Highlight active button
            originalAnimations.querySelectorAll('button').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            originalAnimations.querySelectorAll('button').forEach((btn, i) => {
                if (i !== index) {
                    btn.classList.remove('active');
                }
            });
            
            // Start playing
            setPlaying(true);
        }
        
        // Timeline interaction
        timeline.addEventListener('mousedown', (e) => {
            const rect = timeline.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percentage = x / rect.width;
            scrubToPercentage(percentage);
            
            // Add mousemove event for dragging
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
        
        function onMouseMove(e) {
            const rect = timeline.getBoundingClientRect();
            const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            const percentage = x / rect.width;
            scrubToPercentage(percentage);
        }
        
        function onMouseUp() {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }
        
        function scrubToPercentage(percentage) {
            if (!currentAction) return;
            
            const time = percentage * totalDuration;
            currentTime = time;
            
            // Update mixer time
            mixer.setTime(time);
            
            // Update UI
            updateTimeDisplay();
        }
        
        // Playback controls
        playPauseBtn.addEventListener('click', () => {
            setPlaying(!isPlaying);
        });
        
        loopToggleBtn.addEventListener('click', () => {
            isLooping = !isLooping;
            if (currentAction) {
                currentAction.loop = isLooping ? THREE.LoopRepeat : THREE.LoopOnce;
                currentAction.clampWhenFinished = !isLooping;
            }
            loopToggleBtn.textContent = isLooping ? '🔁 Loop ON' : '↩️ Loop OFF';
        });
        
        playbackSpeedSlider.addEventListener('input', () => {
            playbackSpeed = parseFloat(playbackSpeedSlider.value);
            speedValueSpan.textContent = playbackSpeed.toFixed(1);
            if (mixer) {
                mixer.timeScale = isPlaying ? playbackSpeed : 0;
            }
        });
        
        function setPlaying(play) {
            isPlaying = play;
            if (mixer) {
                mixer.timeScale = isPlaying ? playbackSpeed : 0;
            }
            playPauseBtn.textContent = isPlaying ? '⏸️ Pause' : '▶️ Play';
            playPauseBtn.classList.toggle('active', isPlaying);
        }
        
        // Set start/end points
        document.getElementById('set-start').addEventListener('click', () => {
            startTimeInput.value = currentTime.toFixed(2);
            updateSegmentPreview();
        });
        
        document.getElementById('set-end').addEventListener('click', () => {
            endTimeInput.value = currentTime.toFixed(2);
            updateSegmentPreview();
        });
        
        // Update time display
        function updateTimeDisplay() {
            currentTimeSpan.textContent = currentTime.toFixed(2);
            
            // Update scrubber position
            const percentage = currentTime / totalDuration;
            timelineScrubber.style.left = `${percentage * 100}%`;
        }
        
        // Create a segment preview on the timeline
        function updateSegmentPreview() {
            // Clear existing preview
            const existingPreview = document.querySelector('.segment-preview');
            if (existingPreview) existingPreview.remove();
            
            const startTime = parseFloat(startTimeInput.value);
            const endTime = parseFloat(endTimeInput.value);
            
            if (startTime >= endTime || endTime > totalDuration) return;
            
            const startPercent = startTime / totalDuration * 100;
            const endPercent = endTime / totalDuration * 100;
            const width = endPercent - startPercent;
            
            const segment = document.createElement('div');
            segment.classList.add('timeline-segment', 'segment-preview');
            segment.style.left = `${startPercent}%`;
            segment.style.width = `${width}%`;
            segment.title = `Preview: ${clipNameInput.value} (${startTime.toFixed(2)}s - ${endTime.toFixed(2)}s)`;
            
            timelineSegments.appendChild(segment);
        }
        
        // Initial segment preview
        updateSegmentPreview();
        
        // Preview segment
        document.getElementById('preview-segment').addEventListener('click', () => {
            const startTime = parseFloat(startTimeInput.value);
            const endTime = parseFloat(endTimeInput.value);
            
            if (startTime >= endTime || !currentAction) return;
            
            // Set time to start
            currentTime = startTime;
            mixer.setTime(startTime);
            
            // Start playing
            setPlaying(true);
            
            // Create function to stop at end time
            const checkEndTime = () => {
                if (currentTime >= endTime) {
                    setPlaying(false);
                    document.removeEventListener('animationTimeUpdate', checkEndTime);
                }
            };
            
            document.addEventListener('animationTimeUpdate', checkEndTime);
        });
        
        // Save segment
        document.getElementById('save-segment').addEventListener('click', () => {
            const name = clipNameInput.value || 'Clip';
            const startTime = parseFloat(startTimeInput.value);
            const endTime = parseFloat(endTimeInput.value);
            
            if (startTime >= endTime || !animations[0]) return;
            
            // Create a new AnimationClip
            const originalClip = animations[0];
            const newClip = createSubClip(originalClip, name, startTime, endTime);
            
            // Add to custom clips
            customClips.push(newClip);
            
            // Add to list
            addClipToUI(newClip, customClips.length - 1);
            
            // Update segment display
            addSegmentToTimeline(newClip, startTime, endTime);
            
            // Generate a new name for next clip
            clipNameInput.value = `Clip ${customClips.length + 1}`;
        });
        
        // Create a sub-clip
        function createSubClip(sourceClip, name, startTime, endTime) {
            // Clone tracks and adjust times
            const tracks = [];
            
            sourceClip.tracks.forEach(track => {
                // Clone track times and values
                const times = [];
                const values = [];
                const valueSize = track.getValueSize();
                const isQuaternion = track.name.includes('quaternion');
                
                // First, find keyframes we need to sample or include
                let firstIndex = -1;
                let lastIndex = -1;
                
                // Find frames that bracket our start and end times
                for (let i = 0; i < track.times.length; i++) {
                    if (track.times[i] <= startTime && (i === track.times.length - 1 || track.times[i+1] > startTime)) {
                        firstIndex = i;
                    }
                    if (track.times[i] >= endTime) {
                        lastIndex = i;
                        break;
                    }
                }
                
                // If we need to insert a value at the exact start time and it doesn't exist
                if (firstIndex !== -1 && track.times[firstIndex] !== startTime) {
                    // Interpolate value at exact start time
                    const t0 = track.times[firstIndex];
                    const t1 = track.times[Math.min(firstIndex + 1, track.times.length - 1)];
                    const alpha = (startTime - t0) / (t1 - t0 || 1);
                    
                    // Add exact start time keyframe
                    times.push(0); // Adjusted to 0 for the new clip
                    
                    if (isQuaternion) {
                        // Special handling for quaternions to avoid flipping
                        const q0 = new THREE.Quaternion(
                            track.values[firstIndex * valueSize],
                            track.values[firstIndex * valueSize + 1],
                            track.values[firstIndex * valueSize + 2],
                            track.values[firstIndex * valueSize + 3]
                        );
                        
                        const q1 = new THREE.Quaternion(
                            track.values[(firstIndex + 1) * valueSize],
                            track.values[(firstIndex + 1) * valueSize + 1],
                            track.values[(firstIndex + 1) * valueSize + 2],
                            track.values[(firstIndex + 1) * valueSize + 3]
                        );
                        
                        // Use slerp for proper quaternion interpolation
                        const qResult = new THREE.Quaternion();
                        qResult.slerpQuaternions(q0, q1, alpha);
                        
                        // Store interpolated quaternion
                        for (let j = 0; j < valueSize; j++) {
                            values.push(j === 0 ? qResult.x : j === 1 ? qResult.y : j === 2 ? qResult.z : qResult.w);
                        }
                    } else {
                        // Linear interpolation for other properties
                        for (let j = 0; j < valueSize; j++) {
                            const v0 = track.values[firstIndex * valueSize + j];
                            const v1 = track.values[(firstIndex + 1) * valueSize + j];
                            values.push(v0 + alpha * (v1 - v0));
                        }
                    }
                }
                
                // Add keyframes within our range (adjusted to start from 0)
                for (let i = 0; i < track.times.length; i++) {
                    const time = track.times[i];
                    
                    if (time >= startTime && time <= endTime) {
                        times.push(time - startTime);
                        
                        // Copy corresponding values
                        for (let j = 0; j < valueSize; j++) {
                            values.push(track.values[i * valueSize + j]);
                        }
                    }
                }
                
                // If we need to insert a value at the exact end time and it doesn't exist
                const lastTime = times.length > 0 ? times[times.length - 1] + startTime : 0;
                if (lastTime !== endTime) {
                    // Find frames that bracket our end time
                    let beforeIndex = -1;
                    let afterIndex = -1;
                    
                    for (let i = 0; i < track.times.length - 1; i++) {
                        if (track.times[i] <= endTime && track.times[i+1] >= endTime) {
                            beforeIndex = i;
                            afterIndex = i + 1;
                            break;
                        }
                    }
                    
                    if (beforeIndex !== -1) {
                        // Interpolate value at exact end time
                        const t0 = track.times[beforeIndex];
                        const t1 = track.times[afterIndex];
                        const alpha = (endTime - t0) / (t1 - t0 || 1);
                        
                        // Add exact end time keyframe
                        times.push(endTime - startTime);
                        
                        if (isQuaternion) {
                            // Special handling for quaternions
                            const q0 = new THREE.Quaternion(
                                track.values[beforeIndex * valueSize],
                                track.values[beforeIndex * valueSize + 1],
                                track.values[beforeIndex * valueSize + 2],
                                track.values[beforeIndex * valueSize + 3]
                            );
                            
                            const q1 = new THREE.Quaternion(
                                track.values[afterIndex * valueSize],
                                track.values[afterIndex * valueSize + 1],
                                track.values[afterIndex * valueSize + 2],
                                track.values[afterIndex * valueSize + 3]
                            );
                            
                            // Use slerp for proper quaternion interpolation
                            const qResult = new THREE.Quaternion();
                            qResult.slerpQuaternions(q0, q1, alpha);
                            
                            // Store interpolated quaternion
                            for (let j = 0; j < valueSize; j++) {
                                values.push(j === 0 ? qResult.x : j === 1 ? qResult.y : j === 2 ? qResult.z : qResult.w);
                            }
                        } else {
                            // Linear interpolation for other properties
                            for (let j = 0; j < valueSize; j++) {
                                const v0 = track.values[beforeIndex * valueSize + j];
                                const v1 = track.values[afterIndex * valueSize + j];
                                values.push(v0 + alpha * (v1 - v0));
                            }
                        }
                    }
                }
                
                // Only create track if we have keyframes
                if (times.length > 0) {
                    // Determine appropriate track constructor based on track type
                    let newTrack;
                    
                    if (track instanceof THREE.QuaternionKeyframeTrack) {
                        newTrack = new THREE.QuaternionKeyframeTrack(
                            track.name,
                            times,
                            values,
                            THREE.InterpolateLinear // Use explicit interpolation
                        );
                    } else if (track instanceof THREE.VectorKeyframeTrack) {
                        newTrack = new THREE.VectorKeyframeTrack(
                            track.name,
                            times,
                            values,
                            track.interpolation
                        );
                    } else {
                        newTrack = new THREE.KeyframeTrack(
                            track.name,
                            times,
                            values,
                            track.interpolation
                        );
                    }
                    
                    tracks.push(newTrack);
                }
            });
            
            // Create new clip with the adjusted tracks
            return new THREE.AnimationClip(name, endTime - startTime, tracks);
        }

        // Add clip to UI
        function addClipToUI(clip, index) {
            // Add to list
            const item = document.createElement('div');
            item.classList.add('segment-item');

        // Add segment visualization to timeline

        // Get random color
        function getRandomColor(alpha) {
            const r = Math.floor(Math.random() * 255);
            const g = Math.floor(Math.random() * 255);
            const b = Math.floor(Math.random() * 255);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        
        // Play custom clip
        function playCustomClip(index) {
            if (!mixer || index >= customClips.length) return;
            
            // Stop current animation and reset position
            if (currentAction) {
                currentAction.stop();
            }
            
            // Reset mixer to clear any residual state
            mixer.stopAllAction();
            
            // Start new animation
            const clip = customClips[index];
            currentAction = mixer.clipAction(clip);
            currentAction.clampWhenFinished = !isLooping;
            currentAction.loop = isLooping ? THREE.LoopRepeat : THREE.LoopOnce;
            currentAction.reset();
            currentAction.play();
            
            // Update UI
            totalDuration = clip.duration;
            totalTimeSpan.textContent = totalDuration.toFixed(2);
            
            // Highlight active button
            customClipsContainer.querySelectorAll('button').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            originalAnimations.querySelectorAll('button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Start playing
            setPlaying(true);
        }

        document.getElementById('export-clips').addEventListener('click', () => {

            // Generate JSON
            const json = JSON.stringify(exportData, null, 2);

            console.log("Clip Data:", json);

        // Detect Still Points in Animation
        function detectStillPoints() {
            if (!mixer || !horse || animations.length === 0) {
                alert("Model or animation not loaded yet");
                return;
            }
            
            clearStillPoints();
            
            const loadingMessage = document.createElement('div');
            loadingMessage.textContent = "Analyzing animation...";
            loadingMessage.style.padding = "10px";
            stillPointsContainer.appendChild(loadingMessage);
            
            // Store current state
            const wasPlaying = isPlaying;
            const currentPosition = currentTime;
            
            // Pause animation during analysis
            setPlaying(false);
            
            // Get analysis parameters
            const stillThreshold = parseFloat(stillThresholdSlider.value);
            const minStillDuration = parseFloat(minStillDurationSlider.value);
            
            // Give the UI time to update before starting intensive operation
            setTimeout(() => {
                // Perform analysis
                performStillPointsAnalysis(stillThreshold, minStillDuration)
                    .then((points) => {
                        stillPoints = points;
                        
                        // Remove loading message
                        stillPointsContainer.removeChild(loadingMessage);
                        
                        // Visualize the results
                        visualizeStillPoints(stillPoints);
                        
                        // Restore state
                        mixer.setTime(currentPosition);
                        if (wasPlaying) setPlaying(true);
                    });
            }, 50);
        }
        
        // Perform the actual analysis
        function performStillPointsAnalysis(threshold, minDuration) {
            return new Promise((resolve) => {
                const clip = animations[0];
                const duration = clip.duration;
                const frameRate = 30; // 30 frames per second for analysis
                const frameTime = 1 / frameRate;
                const framesCount = Math.ceil(duration * frameRate);
                
                const points = [];
                
                let prevPositions = null;
                let isStill = false;
                let stillStartTime = 0;
                
                // Save current animation state
                const currentMixerTime = mixer.time;
                
                function captureBoneState() {
                    const state = [];
                    horse.traverse((obj) => {
                        if (obj.isBone) {
                            state.push({
                                name: obj.name,
                                position: obj.position.clone(),
                                quaternion: obj.quaternion.clone()
                            });
                        }
                    });
                    return state;
                }
                
                function calculateMovement(state1, state2) {
                    if (!state1 || !state2) return Infinity;
                    
                    let totalMovement = 0;
                    for (let i = 0; i < state1.length; i++) {
                        const bone1 = state1[i];
                        const bone2 = state2.find(b => b.name === bone1.name);
                        
                        if (bone2) {
                            // Position difference
                            const posDiff = bone1.position.distanceTo(bone2.position);
                            totalMovement += posDiff;
                            
                            // Rotation difference - use quaternion dot product
                            // When quaternions are identical, dot product is 1
                            // So 1 - dot is the difference (0 means identical)
                            const quatDiff = 1 - Math.abs(bone1.quaternion.dot(bone2.quaternion));
                            totalMovement += quatDiff * 2; // Weight rotation changes
                        }
                    }
                    
                    return totalMovement;
                }
                
                let frameIndex = 0;
                
                function processFrame() {
                    if (frameIndex < framesCount) {
                        const frameTime = frameIndex / frameRate;
                        
                        // Set mixer to this time
                        mixer.setTime(frameTime);
                        
                        // Capture current bone positions
                        const currentPositions = captureBoneState();
                        
                        if (prevPositions) {
                            // Calculate movement since last frame
                            const movement = calculateMovement(prevPositions, currentPositions);
                            
                            // Check if this is a still point
                            if (movement < threshold) {
                                if (!isStill) {
                                    // Start of still period
                                    stillStartTime = frameTime;
                                    isStill = true;
                                }
                            } else {
                                if (isStill) {
                                    // End of still period
                                    const stillDuration = frameTime - stillStartTime;
                                    if (stillDuration >= minDuration) {
                                        points.push({
                                            start: stillStartTime,
                                            end: frameTime,
                                            duration: stillDuration,
                                            movement: movement
                                        });
                                    }
                                    isStill = false;
                                }
                            }
                        }
                        
                        prevPositions = currentPositions;
                        frameIndex++;
                        
                        // Process frames in chunks to keep UI responsive
                        if (frameIndex % 10 === 0) {
                            setTimeout(processFrame, 0);
                        } else {
                            processFrame();
                        }
                    } else {
                        // Check if we ended in a still state
                        if (isStill) {
                            const stillDuration = duration - stillStartTime;
                            if (stillDuration >= minDuration) {
                                points.push({
                                    start: stillStartTime,
                                    end: duration,
                                    duration: stillDuration,
                                    movement: 0
                                });
                            }
                        }
                        
                        // Restore original mixer time
                        mixer.setTime(currentMixerTime);
                        
                        // Resolve with results
                        resolve(points);
                    }
                }
                
                // Start processing frames
                processFrame();
            });
        }
        
        // Visualize still points on the timeline and list
        function visualizeStillPoints(points) {
            // Clear previous still points
            stillPointsContainer.innerHTML = '';
            stillPointsLayer.innerHTML = '';
            
            if (points.length === 0) {
                stillPointsContainer.innerHTML = '<div class="still-point-item">No still points detected. Try adjusting threshold.</div>';
                return;
            }
            
            // Add still points to list
            points.forEach((point, index) => {
                const item = document.createElement('div');
                item.classList.add('still-point-item');
                item.innerHTML = `
                    <strong>Still Point ${index + 1}</strong>: 
                    ${point.start.toFixed(2)}s - ${point.end.toFixed(2)}s 
                    (${point.duration.toFixed(2)}s)
                `;
                item.title = "Click to jump to this still point";
                item.addEventListener('click', () => {
                    currentTime = point.start;
                    mixer.setTime(point.start);
                    updateTimeDisplay();
                });
                stillPointsContainer.appendChild(item);
                
                // Add markers to timeline
                const startPercent = (point.start / totalDuration) * 100;
                const endPercent = (point.end / totalDuration) * 100;
                const width = endPercent - startPercent;
                
                // Add segment
                const segment = document.createElement('div');
                segment.classList.add('still-segment');
                segment.style.left = `${startPercent}%`;
                segment.style.width = `${width}%`;
                segment.title = `Still: ${point.start.toFixed(2)}s - ${point.end.toFixed(2)}s`;
                stillPointsLayer.appendChild(segment);
                
                // Add start marker
                const startMarker = document.createElement('div');
                startMarker.classList.add('still-marker');
                startMarker.style.left = `${startPercent}%`;
                startMarker.title = `Still starts: ${point.start.toFixed(2)}s`;
                stillPointsLayer.appendChild(startMarker);
                
                // Add end marker
                const endMarker = document.createElement('div');
                endMarker.classList.add('still-marker');
                endMarker.style.left = `${endPercent}%`;
                endMarker.title = `Still ends: ${point.end.toFixed(2)}s`;
                stillPointsLayer.appendChild(endMarker);
            });
            
            // Add summary
            const summary = document.createElement('div');
            summary.style.marginTop = '10px';
            summary.innerHTML = `
                <strong>Found ${points.length} still point${points.length !== 1 ? 's' : ''}</strong>
                <p>Total still time: ${points.reduce((sum, p) => sum + p.duration, 0).toFixed(2)}s</p>
                <p>Click on any still point to jump to that position</p>
            `;
            stillPointsContainer.appendChild(summary);
        }
        
        // Clear still points visualization
        function clearStillPoints() {
            stillPoints = [];
            stillPointsContainer.innerHTML = '';
            stillPointsLayer.innerHTML = '';
        }
        
        // Event listeners for still point controls
        detectStillPointsBtn.addEventListener('click', detectStillPoints);
        clearStillPointsBtn.addEventListener('click', clearStillPoints);
        
        stillThresholdSlider.addEventListener('input', () => {
            thresholdValueSpan.textContent = parseFloat(stillThresholdSlider.value).toFixed(4);
        });
        
        minStillDurationSlider.addEventListener('input', () => {
            durationValueSpan.textContent = `${parseFloat(minStillDurationSlider.value).toFixed(2)}s`;
        });
        
        // Animation loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Update controls
            controls.update();
            
            // Get delta time
            const delta = clock.getDelta();
            
            // Update animations if playing
            if (mixer && isPlaying) {
                mixer.update(delta);
                currentTime += delta * playbackSpeed;
                
                // Loop if needed
                if (currentTime > totalDuration) {
                    if (isLooping) {
                        currentTime = currentTime % totalDuration;
                        // No need to manually reset the animation as THREE.js handles looping
                    } else {
                        currentTime = totalDuration;
                        setPlaying(false);
                    }
                }
                
                // Update time display
                updateTimeDisplay();
                
                // Dispatch custom event for time update
                document.dispatchEvent(new CustomEvent('animationTimeUpdate'));
            }
            
            // Render scene
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight * 0.7);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight * 0.7);
        });
        
        // Initialize UI
        startTimeInput.addEventListener('change', updateSegmentPreview);
        endTimeInput.addEventListener('change', updateSegmentPreview);
        loopToggleBtn.textContent = '🔁 Loop ON';
    </script>
