<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Horse Animation Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        #scene-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 90%;
        }
        button {
            padding: 8px 16px;
            background-color: #4a7e3f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #5d9e4f;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            font-size: 20px;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="scene-container"></div>
    <div id="loading">Loading horse model...</div>
    <div id="info">Use mouse to rotate the view, scroll to zoom</div>
    <div id="controls"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);
        
        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true;
        document.getElementById('scene-container').appendChild(renderer.domElement);
        
        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(1, 5, 3);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);
        
        // Ground plane
        const groundGeometry = new THREE.PlaneGeometry(20, 20);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x567d46,
            roughness: 0.8
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Variables for model and animations
        let mixer;
        let horse;
        let animations = [];
        let currentAction = null;
        
        // Load horse model
        const loader = new GLTFLoader();
        loader.load('/horse_riggedgame_ready.glb', (gltf) => {
            horse = gltf.scene;
            
            // Set up the model
            horse.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            
            // Center and scale the horse as needed
            horse.scale.set(1, 1, 1);
            
            // Add to scene
            scene.add(horse);
            
            // Set up animations
            mixer = new THREE.AnimationMixer(horse);
            animations = gltf.animations;
            
            // Create animation buttons
            const controlsElement = document.getElementById('controls');
            animations.forEach((clip, index) => {
                const button = document.createElement('button');
                button.textContent = formatAnimationName(clip.name);
                button.addEventListener('click', () => playAnimation(index));
                controlsElement.appendChild(button);
            });
            
            // Hide loading message
            document.getElementById('loading').style.display = 'none';
            
            // Play default animation if available
            if (animations.length > 0) {
                playAnimation(0);
            }
        }, 
        // Progress callback
        (xhr) => {
            const percent = (xhr.loaded / xhr.total) * 100;
            document.getElementById('loading').textContent = 
                `Loading horse model... ${Math.round(percent)}%`;
        }, 
        // Error callback
        (error) => {
            console.error('Error loading model:', error);
            document.getElementById('loading').textContent = 
                'Error loading horse model. Please try again.';
        });
        
        // Format animation names for buttons
        function formatAnimationName(name) {
            // Replace underscores with spaces and capitalize
            return name.replace(/_/g, ' ')
                .replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
        }
        
        // Play animation function
        function playAnimation(index) {
            if (!mixer || index >= animations.length) return;
            
            // Stop current animation
            if (currentAction) {
                currentAction.fadeOut(0.5);
            }
            
            // Start new animation
            const clip = animations[index];
            const action = mixer.clipAction(clip);
            action.reset();
            action.fadeIn(0.5);
            action.play();
            currentAction = action;
        }
        
        // Animation loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Update controls
            controls.update();
            
            // Update animations
            if (mixer) {
                mixer.update(clock.getDelta());
            }
            
            // Render scene
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
